<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>English Helper</title>
  <style>
    body { width: 300px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #1f2430; background: #f7f8fa; }
    .wrap { padding: 16px; }
    h1 { font-size: 17px; margin: 0 0 2px; }
    .sub { color: #6b7280; font-size: 12px; margin-bottom: 14px; }
    #toggle { width: 100%; padding: 12px; border: none; border-radius: 10px; color: #fff; font-size: 15px; cursor: pointer; background: #4caf50; }
    #toggle.off { background: #dc3545; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .stat { background: #fff; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
    .stat .v { font-size: 20px; font-weight: 700; }
    .stat .k { font-size: 11px; color: #6b7280; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 13px; }
    .row button:hover { background: #f1f3f5; }
    .sync { margin-top: 12px; font-size: 11px; color: #6b7280; text-align: center; }
    a { color: #1a73e8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>English Helper</h1>
    <div class="sub">Select any word for pronunciation &amp; dictionary buttons.</div>
    <button id="toggle">Loading&hellip;</button>

    <div class="stats">
      <div class="stat"><div class="v" id="s-total">0</div><div class="k">Words</div></div>
      <div class="stat"><div class="v" id="s-today">0</div><div class="k">Today</div></div>
      <div class="stat"><div class="v" id="s-due">0</div><div class="k">Due</div></div>
    </div>

    <div class="row">
      <button id="openHistory">History</button>
      <button id="openReview">Review</button>
      <button id="openOptions">Settings</button>
    </div>

    <div class="sync" id="syncLine"></div>
  </div>
  <script src="common.js"></script>
  <script src="methods.js"></script>
  <script src="popup.js"></script>
</body>
</html>
